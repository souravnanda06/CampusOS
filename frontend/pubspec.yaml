name: attendance_app
description: A smart daily check-in attendance tracking application
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & Storage
  http: ^1.1.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.0.5
  drift: 2.31.0
  sqlite3: ^2.6.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.6
  path: ^1.9.1
  
  # State Management
  provider: ^6.1.1
  intl: ^0.18.1
  
  # Location & Permissions
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  
  # Bluetooth
  flutter_blue_plus: ^1.31.0      
  flutter_ble_peripheral: ^2.0.1  
  device_info_plus: ^10.0.0       
  
  # --- NEW FEATURES ---
  url_launcher: ^6.2.5            # For Excel Download
  firebase_core: ^2.24.2          # For Notifications
  firebase_messaging: ^14.7.10    # For Notifications
  flutter_local_notifications: ^17.0.0  # For foreground notifications
  
  google_fonts: ^6.1.0      # For the new typography
  flutter_animate: ^4.2.0   # For the smooth UI animations
  
  # Premium UI & Animations
  confetti: ^0.7.0           # Celebration effects
  shimmer: ^3.0.0            # Loading skeletons
  flutter_staggered_animations: ^1.1.1  # List animations
  like_button: ^2.0.5        # Interactive buttons
  
  # UI
  cupertino_icons: ^1.0.2
  animated_text_kit: ^4.3.0
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  local_auth: ^3.0.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  firebase_core_platform_interface: ^5.4.2
  drift_dev: 2.31.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
